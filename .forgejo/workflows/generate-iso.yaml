# yamllint disable rule:line-length
---
# Creates a Live ISO for previewing DAWO on x86_64 hardware and QEMU VMs
name: Create ISO image
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.nix"
      - "flake.lock"
jobs:
  generate-iso:
    runs-on: native
    timeout-minutes: 45
    strategy:
      fail-fast: false
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Generate the KDE ISO and Copy
        env:
          PATH: /run/wrappers/bin:/home/gitea-runner/.nix-profile/bin:/nix/profile/bin:/home/gitea-runner/.local/state/nix/profile/bin:/etc/profiles/per-user/gitea-runner/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
        run: |
          /run/current-system/sw/bin/nix build .#installer-iso-dawo-generic-x86 -o ./result-kde
          /run/current-system/sw/bin/mkdir -p /var/lib/dawo-iso/kde
          /run/current-system/sw/bin/rm /var/lib/dawo-iso/kde/*
          /run/current-system/sw/bin/cp ./result-kde/iso/*.iso /var/lib/dawo-iso/kde/

      - name: Generate the Gnome ISO and Copy
        env:
          PATH: /run/wrappers/bin:/home/gitea-runner/.nix-profile/bin:/nix/profile/bin:/home/gitea-runner/.local/state/nix/profile/bin:/etc/profiles/per-user/gitea-runner/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
        run: |
          /run/current-system/sw/bin/nix build .#installer-iso-dawo-generic-x86-gnome -o ./result-gnome
          /run/current-system/sw/bin/mkdir -p /var/lib/dawo-iso/gnome
          /run/current-system/sw/bin/rm /var/lib/dawo-iso/gnome/*
          /run/current-system/sw/bin/cp ./result-gnome/iso/*.iso /var/lib/dawo-iso/gnome/

