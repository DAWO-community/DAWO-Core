# yamllint disable rule:line-length
---
# Creates a Live ISO for previewing DAWO on x86_64 hardware and QEMU VMs
name: Create ISO image
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.nix"
      - "flake.lock"
jobs:
  generate-iso:
    runs-on: native
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        host:
          - dawo-live-iso
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Generate the ISO
        env:
          PATH: /run/wrappers/bin:/home/gitea-runner/.nix-profile/bin:/nix/profile/bin:/home/gitea-runner/.local/state/nix/profile/bin:/etc/profiles/per-user/gitea-runner/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
        run: |
          /run/current-system/sw/bin/nixos-rebuild build-image --image-variant iso --flake .#"${{ matrix.host }}"

      - name: Upload the ISO
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.host }}.iso
          path: out/${{ matrix.host }}
          retention-days: 90

